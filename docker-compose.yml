# 로컬 개발용 PostgreSQL
# 처음 띄울 때 db/migrations/*.sql 이 파일명 순서대로 자동 실행된다.
services:
  db:
    image: postgres:16
    container_name: ai-stock-db
    environment:
      POSTGRES_USER: ai_stock
      POSTGRES_PASSWORD: ai_stock_pw
      POSTGRES_DB: ai_stock_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
