name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r ai/requirements.txt
      - run: python -m compileall -q ai scripts
      # DB · Chronos · LLM 없이 도는 단위 테스트 (가짜 데이터 · 가짜 LLM)
      - run: python -m pytest -q
